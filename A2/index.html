<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="content">
        <form class="color-picker" action=""> <!-- This lets the user change the colour theme of the webpage to suit their visual preference. -->
            <fieldset>
                <legend>
                    <input type="radio" id="dark" name="theme" checked>
                    <label for="theme">Dark</label>

                    <input type="radio" id="light" name="theme">
                    <label for="theme">Light</label>
                </legend>
            </fieldset>
        </form>

        <div id="row"> <!-- Include the album cover, title and author as immediate information to quickly communicate to the user who and what they are listening to. -->
            <div id="album-cover">
                <img src="images/cover.jpg"></img>
            </div>
            <div id="album-details">
                <div id="padding">
                    <h1>Water Feature EP</h1>
                    <a>By </a><a id="fakelink">Foots</a> <!-- Including a link to the author's homepage allows easy access to more of their content. A significant portion of listeners may want to explore more of their work, find them on other social media platforms, buy their merchandise, or simply follow or contact them. By grouping all of these potential interactions within a single link, the navigation of the website is much more streamlined. -->
                </div>
                <div id="padding">
                    <p>(Album description)</p>
                </div>
            </div>
        </div>
        <div id="row">
            <audio src="audio/0.mp3" id="bounceAudio" controls></audio>
        </div>
        <div id="row">
            <div id="column">
                <div id="padding">
                    <h2>Tracklist</h2> <!-- The ability to click tracks to play them significantly improves navigation, and also allows selection of certain tracks based on preference. -->
                    <br>
                    <p><button onclick="playAudio (1)">1. He's</button></p>
                    <p><button onclick="playAudio (2)">2. Dry Down (ft. Ben Snaath)</button></p>
                    <p><button onclick="playAudio (3)">3. Leapt</button></p>
                    <p><button onclick="playAudio (4)">4. Water Feature</button></p>
                    <br>
                    <p>Released October 18, 2014</p>
                    <br>
                    <h3 id="fakelink">Buy Digital Album</h3> <!-- Including a link to purchase the album allows passionate listeners to obtain the music in higher quality, support the author, or both. Giving users a clear means to support your work builds both a side income and stronger community.-->
                    <br>
                    <p>© All Rights Reserved</p>
                </div>
            </div>
            <div id="column">
                <div id="padding">
                    <h2>Comments</h2> <!-- A means of social interaction is a way for users to engage with the author and each other, providing more opportunities for a stronger community. -->
                </div>
            </div>
        </div>
        <div id="row">
            <br>
            <p style="color:var(--color-text-subtle)">You might also like:</p> <!-- Album recommendations is an additional resource for users to discover new music and potentially broaden their taste. -->
            <br>
            <div id="album-cover">
                <img src="images/cover_blank.jpg" id="fakelink"></img>

                <div id="padding">
                    <p id="fakelink">Album Title</p>
                    <a>By </a><a id="fakelink">Author</a>
                </div>
            </div>
            <div id="album-cover">
                <img src="images/cover_blank.jpg" id="fakelink"></img>

                <div id="padding">
                    <p id="fakelink">Album Title</p>
                    <a>By </a><a id="fakelink">Author</a>
                </div>
            </div>
            <div id="album-cover">
                <img src="images/cover_blank.jpg" id="fakelink"></img>

                <div id="padding">
                    <p id="fakelink">Album Title</p>
                    <a>By </a><a id="fakelink">Author</a>
                </div>
            </div>
            <div id="album-cover">
                <img src="images/cover_blank.jpg" id="fakelink"></img>

                <div id="padding">
                    <p id="fakelink">Album Title</p>
                    <a>By </a><a id="fakelink">Author</a>
                </div>
            </div>
            <div id="album-cover">
                <img src="images/cover_blank.jpg" id="fakelink"></img>

                <div id="padding">
                    <p id="fakelink">Album Title</p>
                    <a>By </a><a id="fakelink">Author</a>
                </div>
            </div>
        </div>
    </div>
</body>

<script>
    const audio = document.getElementById('bounceAudio');
    let currentTrack = 1;

    function playAudio(trackNumber) {
        currentTrack = trackNumber;

        audio.src = `audio/${trackNumber - 1}.mp3`;

        audio.onloadstart = () => audio.play();
    }

    audio.addEventListener('ended', playNextTrack); // This allows the full sequence of tracks to play automatically without human intervention, which is especially useful for long periods of focus when distractions should be minimised.

    function playNextTrack() {
        if (currentTrack < 4) { // Stops at the final track, since there are none left to autoplay
            playAudio(currentTrack + 1);
        }
    }
</script>

</html>
