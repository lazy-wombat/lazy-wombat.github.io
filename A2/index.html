<script>
    const audio = document.getElementById('bounceAudio');
    let currentTrack = 1;

    function playAudio(trackNumber) {
        currentTrack = trackNumber;

        audio.src = `audio/${trackNumber - 1}.mp3`;

        audio.onloadstart = () => audio.play();
    }

    audio.addEventListener('ended', playNextTrack); // This allows the full sequence of tracks to play automatically without human intervention, which is espeically useful for long periods of focus when distractions should be minimised.

    function playNextTrack() {
        if (currentTrack < 4) {
            playAudio(currentTrack + 1);
        }
    }
</script>
